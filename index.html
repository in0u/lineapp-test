<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>相性占いゲーム</title>
  <style>
    :root {
      --bg-color: #f6f8fb;
      --card-bg: #ffffff;
      --primary: #20c997;
      --accent-a: #20c997;
      --accent-b: #ff6b6b;
      --accent-c: #845ef7;
      --text-main: #2b2d42;
      --text-sub: #8d99ae;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ヘッダー */
    header {
      padding: 10px 16px;
      background: #fff;
      border-bottom: 1px solid #edf2f7;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }
    .badge {
      background: #e6fcf5;
      color: #0ca678;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 13px;
    }
    .counter {
      font-size: 14px;
      font-weight: bold;
      color: var(--text-sub);
    }

    /* マップエリア（上半分） */
    #map-container {
      height: 42%;
      background: #2b2d42;
      position: relative;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-behavior: smooth;
    }
    #map-svg {
      height: 100%;
      min-width: 1450px;
      display: block;
    }

    /* 主人公キャラ */
    #player-avatar {
      position: absolute;
      width: 44px;
      height: 44px;
      transform: translate(-50%, -50%);
      transition: left 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), top 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: none;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: playerBounce 0.8s infinite alternate ease-in-out;
    }
    .player-icon {
      font-size: 26px;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
    }
    @keyframes playerBounce {
      0% { transform: translate(-50%, -70%); }
      100% { transform: translate(-50%, -90%); }
    }

    /* 質問カードエリア（下半分） */
    #quiz-container {
      height: 58%;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: #f8fafc;
      overflow-y: auto;
    }

    .question-box {
      background: #fff;
      border-radius: 16px;
      padding: 14px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
      border: 1px solid #edf2f7;
    }
    .q-tag {
      font-size: 11px;
      font-weight: 900;
      color: var(--primary);
      letter-spacing: 1px;
      margin-bottom: 4px;
      display: block;
    }
    .q-text {
      font-size: 15px;
      font-weight: bold;
      line-height: 1.4;
      color: var(--text-main);
    }

    /* 選択肢ボタン (A / B / C) */
    .choices-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin: 8px 0;
    }
    .choice-card {
      background: #fff;
      border-radius: 14px;
      padding: 10px 14px;
      border: 2px solid transparent;
      box-shadow: 0 4px 10px rgba(0,0,0,0.03);
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: transform 0.1s, border-color 0.2s, box-shadow 0.2s;
    }
    .choice-card:active {
      transform: scale(0.97);
    }
    .choice-badge {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 14px;
      color: #fff;
      flex-shrink: 0;
    }
    .choice-card.type-A { border-color: #e6fcf5; }
    .choice-card.type-A .choice-badge { background: var(--accent-a); }
    .choice-card.type-B { border-color: #ffe3e3; }
    .choice-card.type-B .choice-badge { background: var(--accent-b); }
    .choice-card.type-C { border-color: #f3f0ff; }
    .choice-card.type-C .choice-badge { background: var(--accent-c); }

    .choice-text {
      font-size: 13px;
      font-weight: bold;
      color: #495057;
      text-align: left;
    }

    /* 結果モーダル（ド派手演出） */
    #result-modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 40px 20px 30px;
      overflow: hidden;
      animation: modalFadeIn 0.4s ease forwards;
    }
    @keyframes modalFadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    /* ぐるぐる渦巻きアニメーション背景 */
    .spiral-bg {
      position: absolute;
      inset: -100%;
      width: 300%;
      height: 300%;
      background: repeating-conic-gradient(
        var(--res-bg-1) 0deg 15deg,
        var(--res-bg-2) 15deg 30deg
      );
      animation: rotateSpiral 25s linear infinite;
      z-index: 1;
    }
    @keyframes rotateSpiral {
      100% { transform: rotate(360deg); }
    }

    /* ちぎり紙風タイトル */
    .paper-banner {
      position: relative;
      z-index: 10;
      background: #ffffff;
      padding: 10px 25px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.25);
      border-radius: 4px;
      transform: rotate(-3deg);
      border: 2px dashed #333;
      text-align: center;
      max-width: 90%;
    }
    .paper-banner .tag {
      color: #2b8a3e;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 1px;
    }
    .paper-banner .main-title {
      font-size: 26px;
      font-weight: 900;
      color: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .corner-face {
      position: absolute;
      right: -18px;
      top: -24px;
      font-size: 34px;
      transform: rotate(12deg);
    }

    /* 中央キャラ・判定 */
    .character-area {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .rank-text {
      position: absolute;
      top: -30px;
      left: -20px;
      font-size: 46px;
      font-weight: 900;
      color: #ffffff;
      -webkit-text-stroke: 3px #000;
      text-shadow: 4px 4px 0 #000;
      transform: rotate(-10deg);
      z-index: 15;
    }
    .yellow-circle {
      width: 220px;
      height: 220px;
      background: radial-gradient(circle, #fff3bf 60%, #ffd43b 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      border: 4px solid #fff;
      overflow: hidden;
    }
    .main-character {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 90px;
      animation: charPulse 1.2s infinite alternate ease-in-out;
    }
    .main-character img {
      max-width: 85%;
      max-height: 85%;
      object-fit: contain;
    }
    @keyframes charPulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.06); }
    }

    /* 下部テキスト */
    .result-footer-text {
      position: relative;
      z-index: 10;
      text-align: center;
    }
    .impact-text-1 {
      font-size: 22px;
      font-weight: 900;
      color: #ffea00;
      -webkit-text-stroke: 2px #000;
      text-shadow: 3px 3px 0 #000;
      margin-bottom: 4px;
    }
    .impact-text-2 {
      font-size: 20px;
      font-weight: 900;
      color: #ffffff;
      -webkit-text-stroke: 2px #000;
      text-shadow: 3px 3px 0 #000;
    }

    .retry-btn {
      position: relative;
      z-index: 10;
      margin-top: 15px;
      background: #fff;
      border: 3px solid #000;
      color: #000;
      font-size: 16px;
      font-weight: 900;
      padding: 10px 35px;
      border-radius: 30px;
      box-shadow: 0 6px 0 #000;
      cursor: pointer;
      outline: none;
    }
    .retry-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #000;
    }
  </style>
</head>
<body>

  <header>
    <span class="badge">相性診断マップ</span>
    <span class="counter" id="progress-text">残り 10 問</span>
  </header>

  <!-- マップエリア -->
  <div id="map-container">
    <svg id="map-svg"></svg>
    <div id="player-avatar">
      <div class="player-icon">👑</div>
    </div>
  </div>

  <!-- クイズエリア -->
  <div id="quiz-container">
    <div class="question-box">
      <span class="q-tag" id="q-number">QUESTION 01</span>
      <div class="q-text" id="q-text">読み込み中...</div>
    </div>

    <div class="choices-list" id="choices-container"></div>
    <div style="font-size: 10px; color: #adb5bd; text-align: center;">直感でカードを選択してください</div>
  </div>

  <!-- 結果モーダル（渦巻き画面） -->
  <div id="result-modal">
    <div class="spiral-bg" id="spiral-bg"></div>

    <div class="paper-banner">
      <div class="tag" id="res-tag">#きょうの占い</div>
      <div class="main-title" id="res-title">相性診断</div>
      <div class="corner-face" id="res-corner-face">🤪</div>
    </div>

    <div class="character-area">
      <div class="rank-text" id="res-rank">大吉</div>
      <div class="yellow-circle">
        <div class="main-character" id="res-char">🐼</div>
      </div>
    </div>

    <div class="result-footer-text">
      <div class="impact-text-1" id="res-line1">今日はみんなの人気者！</div>
      <div class="impact-text-2" id="res-line2">〜相性抜群のパートナー〜</div>
      <button class="retry-btn" onclick="restartGame()">もう一度占う</button>
    </div>
  </div>

  <script>
    /* =========================================================
       ★ ゲーム設定（テキスト・結果・質問文はここを編集）★
       ========================================================= */
    const GAME_DATA = {
      // 質問リスト（全10問）
      questions: [
        {
          text: "休日に突然丸一日予定が空いたらどうする？",
          choices: [
            { label: "前日から綿密に計画して遠出する", type: "A" },
            { label: "近場のカフェやサウナで適当に過ごす", type: "B" },
            { label: "ベッドから一歩も出ず夕方まで寝る", type: "C" }
          ]
        },
        {
          text: "LINEの返信速度、自分はぶっちゃけ…",
          choices: [
            { label: "通知即レス派。溜めるのが嫌い", type: "A" },
            { label: "気付いたら返す。基本マイペース", type: "B" },
            { label: "未読スルー常習犯。数日後もザラ", type: "C" }
          ]
        },
        {
          text: "友達とのご飯、店を決める時は？",
          choices: [
            { label: "食べログやSNSで映えや評価を徹底リサーチ", type: "A" },
            { label: "とりあえずその場で目に入った店に入る", type: "B" },
            { label: "「何でもいいよ〜」と他人に全任せ", type: "C" }
          ]
        },
        {
          text: "買い物をするときの一番の決め手は？",
          choices: [
            { label: "デザイン・見た目の直感", type: "A" },
            { label: "コスパと機能性のバランス", type: "B" },
            { label: "店員さんの熱意に押されて勢い", type: "C" }
          ]
        },
        {
          text: "人との会話で一番大事にしたいのは？",
          choices: [
            { label: "テンポと笑い（ボケ・ツッコミ）", type: "A" },
            { label: "共感と穏やかな空気感", type: "B" },
            { label: "有益な情報や深い議論", type: "C" }
          ]
        },
        {
          text: "ピンチの時（遅刻確定など）の行動は？",
          choices: [
            { label: "すぐに全力で謝罪＆現状報告", type: "A" },
            { label: "ギリギリまで最短ルートを探して足掻く", type: "B" },
            { label: "「まあなんとかなるか」と開き直る", type: "C" }
          ]
        },
        {
          text: "カラオケに行ったらどう振る舞う？",
          choices: [
            { label: "最新の流行曲を歌いまくる", type: "A" },
            { label: "タンバリンや合いの手で盛り上げに徹する", type: "B" },
            { label: "端っこでポテトを食べながら聴く専", type: "C" }
          ]
        },
        {
          text: "旅行に行くときの荷物は？",
          choices: [
            { label: "万が一に備えてパンパンの大荷物", type: "A" },
            { label: "リュック1つのミニマリスト", type: "B" },
            { label: "忘れ物だらけで現地調達スタイル", type: "C" }
          ]
        },
        {
          text: "今夜の夕食、迷ったときの第一候補は？",
          choices: [
            { label: "がっつり肉・ラーメン", type: "A" },
            { label: "さっぱり和食・お寿司", type: "B" },
            { label: "スパイシーなカレー・激辛系", type: "C" }
          ]
        },
        /* ★オチの第10問：この回答ですべてが決まる！★ */
        {
          text: "【究極の選択】正直、きのこ派？たけのこ派？",
          choices: [
            { label: "絶対にきのこの山！", type: "A" },
            { label: "愚問、たけのこの里一択！", type: "B" },
            { label: "アルフォートが一番うまい", type: "C" }
          ]
        }
      ],

      /* 結果データ（絵文字・images/フォルダ内の画像パスどちらも指定可能） */
      results: {
        A: {
          tag: "#きょうの作者診断",
          title: "パンパン相性",
          cornerFace: "🤩",
          rank: "大吉",
          char: "🐼",
          bgColors: ["#48bb78", "#38a169"],
          line1: "奇跡のシンクロ率120%！",
          line2: "〜前世は双子のパンダ〜"
        },
        B: {
          tag: "#きょうの作者診断",
          title: "相性絶望",
          cornerFace: "😱",
          rank: "大凶",
          char: "👿",
          bgColors: ["#e53e3e", "#c53030"],
          line1: "相性0%！前世からの宿敵！",
          line2: "〜絶対に分かり合えない関係〜"
        },
        C: {
          tag: "#きょうの作者診断",
          title: "微妙な相性",
          cornerFace: "🫠",
          rank: "中吉",
          char: "🗿",
          bgColors: ["#805ad5", "#6b46c1"],
          line1: "相性50%！程よいビジネス仲間！",
          line2: "〜年に1回会えば十分な距離感〜"
        }
      }
    };

    /* =========================================================
       マップ構造の生成
       ステップ0〜8（第8問）まで最大5列を維持
       ステップ9で中央1ノード（0）へ一斉収束
       ステップ10で🔥1つに完全合流
       ========================================================= */
    const TOTAL_STEPS = 10;
    const NODE_SPACING_X = 130;
    const SVG_HEIGHT = 260;
    const CENTER_Y = SVG_HEIGHT / 2;
    const ROW_OFFSET = 38;

    const STEP_ROWS = [
      [0],               // 0: スタート
      [-1, 0, 1],        // 1
      [-1, 0, 1],        // 2
      [-2, -1, 0, 1, 2], // 3（5列に拡大）
      [-2, -1, 0, 1, 2], // 4
      [-2, -1, 0, 1, 2], // 5
      [-2, -1, 0, 1, 2], // 6
      [-2, -1, 0, 1, 2], // 7
      [-2, -1, 0, 1, 2], // 8（第8問までワイドな5列をキープ！）
      [0],               // 9（第9問で一気に中央1ノードへ大収束！）
      [0]                // 10（完全収束：🔥ボスアイコン）
    ];

    const ICONS_POOL = ["⚔️", "☕", "❤️", "💎", "🛡️", "🔮", "✨", "🎲", "🍖"];

    let nodes = {};
    let edges = [];

    // ノード定義
    for (let step = 0; step <= TOTAL_STEPS; step++) {
      const rows = STEP_ROWS[step];
      rows.forEach(r => {
        const id = `${step}_${r}`;
        let icon = "❓";
        if (step === 0) icon = "🚩";
        else if (step === TOTAL_STEPS) icon = "🔥";
        else icon = ICONS_POOL[(step * 3 + Math.abs(r)) % ICONS_POOL.length];

        nodes[id] = {
          id: id,
          step: step,
          row: r,
          x: 60 + step * NODE_SPACING_X,
          y: CENTER_Y + r * ROW_OFFSET,
          icon: icon
        };
      });
    }

    // エッジ（接続線）の接続
    for (let step = 0; step < TOTAL_STEPS; step++) {
      const currentRows = STEP_ROWS[step];
      const nextRows = STEP_ROWS[step + 1];

      currentRows.forEach(cr => {
        const fromId = `${step}_${cr}`;
        nextRows.forEach(nr => {
          // 次の列が1つだけ（収束ステップ）なら全員から中央へ接続
          if (nextRows.length === 1) {
            edges.push({ from: fromId, to: `${step+1}_0` });
          } else if (Math.abs(cr - nr) <= 1) {
            // 通常時は上下±1以内で網の目状に接続
            edges.push({ from: fromId, to: `${step+1}_${nr}` });
          }
        });
      });
    }

    /* =========================================================
       マップ描画（SVG）
       ========================================================= */
    const svg = document.getElementById('map-svg');

    function hexPath(cx, cy, r) {
      let path = "";
      for (let i = 0; i < 6; i++) {
        const angle = (Math.PI / 3) * i;
        const x = cx + r * Math.cos(angle);
        const y = cy + r * Math.sin(angle);
        path += (i === 0 ? "M" : "L") + `${x},${y}`;
      }
      return path + "Z";
    }

    edges.forEach(e => {
      const n1 = nodes[e.from];
      const n2 = nodes[e.to];
      const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
      line.setAttribute("x1", n1.x);
      line.setAttribute("y1", n1.y);
      line.setAttribute("x2", n2.x);
      line.setAttribute("y2", n2.y);
      line.setAttribute("stroke", "#4a4e69");
      line.setAttribute("stroke-width", "2");
      line.setAttribute("stroke-dasharray", "4,3");
      line.setAttribute("id", `edge-${e.from}-${e.to}`);
      svg.appendChild(line);
    });

    Object.values(nodes).forEach(n => {
      const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
      g.setAttribute("id", `node-${n.id}`);

      const hex = document.createElementNS("http://www.w3.org/2000/svg", "path");
      hex.setAttribute("d", hexPath(n.x, n.y, 20));
      hex.setAttribute("fill", n.step === TOTAL_STEPS ? "#ff6b6b" : "#3d405b");
      hex.setAttribute("stroke", "#8d99ae");
      hex.setAttribute("stroke-width", "2");
      g.appendChild(hex);

      const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
      text.setAttribute("x", n.x);
      text.setAttribute("y", n.y + 6);
      text.setAttribute("text-anchor", "middle");
      text.setAttribute("font-size", n.step === TOTAL_STEPS ? "18" : "15");
      text.textContent = n.icon;
      g.appendChild(text);

      svg.appendChild(g);
    });

    /* =========================================================
       ゲーム進行ロジック
       ========================================================= */
    let currentStep = 0;
    let currentRow = 0;
    let lastChoiceType = "A";

    function updatePlayerPosition() {
      const currentNodeId = `${currentStep}_${currentRow}`;
      const node = nodes[currentNodeId];
      const avatar = document.getElementById('player-avatar');

      avatar.style.left = `${node.x}px`;
      avatar.style.top = `${node.y}px`;

      const container = document.getElementById('map-container');
      const targetScroll = node.x - container.clientWidth / 2;
      container.scrollTo({ left: Math.max(0, targetScroll), behavior: 'smooth' });

      const nodeEl = document.getElementById(`node-${currentNodeId}`);
      if (nodeEl) {
        nodeEl.querySelector('path').setAttribute('fill', '#20c997');
        nodeEl.querySelector('path').setAttribute('stroke', '#fff');
      }
    }

    function renderQuestion() {
      if (currentStep >= TOTAL_STEPS) {
        showFinalResult();
        return;
      }

      const q = GAME_DATA.questions[currentStep];
      document.getElementById('q-number').textContent = `QUESTION ${String(currentStep + 1).padStart(2, '0')}`;
      document.getElementById('progress-text').textContent = `残り ${TOTAL_STEPS - currentStep} 問`;
      document.getElementById('q-text').textContent = q.text;

      const choicesBox = document.getElementById('choices-container');
      choicesBox.innerHTML = '';

      q.choices.forEach(c => {
        const card = document.createElement('div');
        card.className = `choice-card type-${c.type}`;
        card.innerHTML = `
          <div class="choice-badge">${c.type}</div>
          <div class="choice-text">${c.label}</div>
        `;
        card.onclick = () => selectChoice(c.type);
        choicesBox.appendChild(card);
      });
    }

    function selectChoice(type) {
      lastChoiceType = type;
      const nextStep = currentStep + 1;

      // 収束ステップ（9と10）は必ず0（中央）へ向かう
      let nextRow = 0;
      if (nextStep < 9) {
        const candidateRows = STEP_ROWS[nextStep];
        let idealRow = currentRow;
        if (type === 'A') idealRow -= 1; // 上へ
        if (type === 'C') idealRow += 1; // 下へ

        // 最も近い有効な行へ
        nextRow = candidateRows.reduce((prev, curr) =>
          Math.abs(curr - idealRow) < Math.abs(prev - idealRow) ? curr : prev
        );
      }

      // エッジのハイライト
      const edgeId = `edge-${currentStep}_${currentRow}-${nextStep}_${nextRow}`;
      const edgeEl = document.getElementById(edgeId);
      if (edgeEl) {
        edgeEl.setAttribute('stroke', '#20c997');
        edgeEl.setAttribute('stroke-width', '3');
        edgeEl.removeAttribute('stroke-dasharray');
      }

      currentStep = nextStep;
      currentRow = nextRow;

      updatePlayerPosition();

      if (currentStep < TOTAL_STEPS) {
        renderQuestion();
      } else {
        setTimeout(showFinalResult, 600);
      }
    }

    function renderCharContent(charVal) {
      if (typeof charVal === 'string' && (charVal.includes('/') || charVal.endsWith('.png') || charVal.endsWith('.jpg') || charVal.endsWith('.webp'))) {
        return `<img src="${charVal}" alt="character">`;
      }
      return charVal;
    }

    function showFinalResult() {
      const res = GAME_DATA.results[lastChoiceType] || GAME_DATA.results.A;
      const modal = document.getElementById('result-modal');

      document.getElementById('spiral-bg').style.setProperty('--res-bg-1', res.bgColors[0]);
      document.getElementById('spiral-bg').style.setProperty('--res-bg-2', res.bgColors[1]);

      document.getElementById('res-tag').textContent = res.tag;
      document.getElementById('res-title').textContent = res.title;
      document.getElementById('res-corner-face').innerHTML = renderCharContent(res.cornerFace);
      document.getElementById('res-rank').textContent = res.rank;
      document.getElementById('res-char').innerHTML = renderCharContent(res.char);
      document.getElementById('res-line1').textContent = res.line1;
      document.getElementById('res-line2').textContent = res.line2;

      modal.style.display = 'flex';
    }

    function restartGame() {
      location.reload();
    }

    window.onload = () => {
      updatePlayerPosition();
      renderQuestion();
    };
  </script>
</body>
</html>
