<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>相性診断</title>
  <style>
    :root {
      --bg-page: #fff5f7;
      --card-white: #ffffff;
      --pink-main: #ff7597;
      --pink-light: #ffe3ec;
      --pink-soft: #fff0f5;
      --lavender: #b197fc;
      --gold-accent: #f59f00;
      --text-dark: #3a2e39;
      --text-muted: #9c8e9b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
      background: var(--bg-page);
      color: var(--text-dark);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ヘッダー */
    header {
      padding: 10px 18px;
      background: #ffffff;
      border-bottom: 1px solid #f8d7da;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      box-shadow: 0 2px 10px rgba(255, 117, 151, 0.08);
    }
    .badge {
      background: linear-gradient(135deg, #ff7597, #ff9ebb);
      color: #ffffff;
      font-weight: 800;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 12px;
      letter-spacing: 0.5px;
      box-shadow: 0 2px 6px rgba(255, 117, 151, 0.3);
    }
    .counter {
      font-size: 13px;
      font-weight: 800;
      color: #d6336c;
      background: var(--pink-light);
      padding: 4px 10px;
      border-radius: 12px;
    }

    /* マップエリア（上部：夜空・クリスタル感のあるグラデ） */
    #map-container {
      height: 42%;
      background: radial-gradient(circle at top right, #382548 0%, #1e152a 100%);
      position: relative;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-behavior: smooth;
      border-bottom: 3px solid #ffccd5;
    }
    #map-svg {
      height: 100%;
      min-width: 1450px;
      display: block;
    }

    /* 主人公キャラ（フェレット） */
    #player-avatar {
      position: absolute;
      width: 48px;
      height: 48px;
      transform: translate(-50%, -50%);
      transition: left 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), top 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: none;
      z-index: 25;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: playerFloat 1.5s infinite alternate ease-in-out;
    }
    .avatar-wrapper {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 3px solid #ffffff;
      box-shadow: 0 0 15px rgba(255, 117, 151, 0.9), 0 4px 10px rgba(0,0,0,0.3);
      overflow: hidden;
      background: #79c2d0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .avatar-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .avatar-fallback {
      font-size: 24px;
    }
    @keyframes playerFloat {
      0% { transform: translate(-50%, -75%); }
      100% { transform: translate(-50%, -95%); }
    }

    /* 質問カードエリア（下部：ちゅるんとしたピンク系） */
    #quiz-container {
      height: 58%;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: linear-gradient(180deg, #fff5f8 0%, #ffffff 100%);
      overflow-y: auto;
    }

    .question-box {
      background: #ffffff;
      border-radius: 20px;
      padding: 14px 18px;
      box-shadow: 0 6px 20px rgba(255, 117, 151, 0.08);
      border: 1.5px solid #ffe3ec;
      position: relative;
    }
    .q-tag {
      font-size: 11px;
      font-weight: 900;
      color: var(--pink-main);
      letter-spacing: 1.5px;
      margin-bottom: 4px;
      display: inline-block;
      background: var(--pink-light);
      padding: 2px 8px;
      border-radius: 8px;
    }
    .q-text {
      font-size: 15px;
      font-weight: 800;
      line-height: 1.45;
      color: var(--text-dark);
      margin-top: 4px;
    }

    /* 選択肢ボタン (A / B / C) */
    .choices-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 8px 0;
    }
    .choice-card {
      background: #ffffff;
      border-radius: 18px;
      padding: 12px 16px;
      border: 1.5px solid #f8d7da;
      box-shadow: 0 4px 12px rgba(230, 73, 128, 0.05);
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
    }
    .choice-card:active {
      transform: scale(0.97);
      background: var(--pink-soft);
      border-color: var(--pink-main);
    }
    .choice-badge {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 15px;
      color: #fff;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .choice-card.type-A .choice-badge { background: linear-gradient(135deg, #ff7597, #f783ac); }
    .choice-card.type-B .choice-badge { background: linear-gradient(135deg, #da77f2, #be4bdb); }
    .choice-card.type-C .choice-badge { background: linear-gradient(135deg, #ffa94d, #ff922b); }

    .choice-text {
      font-size: 13px;
      font-weight: 700;
      color: #495057;
      text-align: left;
      line-height: 1.35;
    }

    /* 結果モーダル（ド派手渦巻き画面） */
    #result-modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 40px 20px 30px;
      overflow: hidden;
      animation: modalFadeIn 0.4s ease forwards;
    }
    @keyframes modalFadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .spiral-bg {
      position: absolute;
      inset: -100%;
      width: 300%;
      height: 300%;
      background: repeating-conic-gradient(
        var(--res-bg-1) 0deg 15deg,
        var(--res-bg-2) 15deg 30deg
      );
      animation: rotateSpiral 25s linear infinite;
      z-index: 1;
    }
    @keyframes rotateSpiral {
      100% { transform: rotate(360deg); }
    }

    .paper-banner {
      position: relative;
      z-index: 10;
      background: #ffffff;
      padding: 10px 25px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.25);
      border-radius: 8px;
      transform: rotate(-3deg);
      border: 3px dashed #ff7597;
      text-align: center;
      max-width: 90%;
    }
    .paper-banner .tag {
      color: #e64980;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 1px;
    }
    .paper-banner .main-title {
      font-size: 26px;
      font-weight: 900;
      color: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .corner-face {
      position: absolute;
      right: -18px;
      top: -24px;
      font-size: 34px;
      transform: rotate(12deg);
    }

    .character-area {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .rank-text {
      position: absolute;
      top: -30px;
      left: -20px;
      font-size: 46px;
      font-weight: 900;
      color: #ffffff;
      -webkit-text-stroke: 3px #000;
      text-shadow: 4px 4px 0 #000;
      transform: rotate(-10deg);
      z-index: 15;
    }
    .yellow-circle {
      width: 220px;
      height: 220px;
      background: radial-gradient(circle, #fff3bf 60%, #ffd43b 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      border: 4px solid #fff;
      overflow: hidden;
    }
    .main-character {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 90px;
      animation: charPulse 1.2s infinite alternate ease-in-out;
    }
    .main-character img {
      max-width: 85%;
      max-height: 85%;
      object-fit: contain;
    }
    @keyframes charPulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.06); }
    }

    .result-footer-text {
      position: relative;
      z-index: 10;
      text-align: center;
    }
    .impact-text-1 {
      font-size: 22px;
      font-weight: 900;
      color: #ffea00;
      -webkit-text-stroke: 2px #000;
      text-shadow: 3px 3px 0 #000;
      margin-bottom: 4px;
    }
    .impact-text-2 {
      font-size: 20px;
      font-weight: 900;
      color: #ffffff;
      -webkit-text-stroke: 2px #000;
      text-shadow: 3px 3px 0 #000;
    }

    .retry-btn {
      position: relative;
      z-index: 10;
      margin-top: 15px;
      background: linear-gradient(135deg, #ffffff, #fff0f5);
      border: 3px solid #ff7597;
      color: #e64980;
      font-size: 16px;
      font-weight: 900;
      padding: 10px 35px;
      border-radius: 30px;
      box-shadow: 0 6px 0 #ff7597;
      cursor: pointer;
      outline: none;
    }
    .retry-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #ff7597;
    }
  </style>
</head>
<body>

  <header>
    <span class="badge">💖 相性診断マップ</span>
    <span class="counter" id="progress-text">残り 10 問</span>
  </header>

  <!-- マップエリア -->
  <div id="map-container">
    <svg id="map-svg"></svg>
    <div id="player-avatar">
      <div class="avatar-wrapper">
        <!-- images/player.png があれば画像を表示。なければ絵文字を表示 -->
        <img id="player-img" src="images/player.png" onerror="this.style.display='none'; document.getElementById('player-emoji').style.display='block';" alt="player">
        <span id="player-emoji" class="avatar-fallback" style="display:none;">🐾</span>
      </div>
    </div>
  </div>

  <!-- クイズエリア -->
  <div id="quiz-container">
    <div class="question-box">
      <span class="q-tag" id="q-number">QUESTION 01</span>
      <div class="q-text" id="q-text">読み込み中...</div>
    </div>

    <div class="choices-list" id="choices-container"></div>
    <div style="font-size: 11px; color: #b197fc; text-align: center; font-weight: 700;">✨ 直感でえらんでね ✨</div>
  </div>

  <!-- 結果モーダル（ド派手渦巻き画面） -->
  <div id="result-modal">
    <div class="spiral-bg" id="spiral-bg"></div>

    <div class="paper-banner">
      <div class="tag" id="res-tag">#きょうの占い</div>
      <div class="main-title" id="res-title">相性診断</div>
      <div class="corner-face" id="res-corner-face">🤪</div>
    </div>

    <div class="character-area">
      <div class="rank-text" id="res-rank">大吉</div>
      <div class="yellow-circle">
        <div class="main-character" id="res-char">🐼</div>
      </div>
    </div>

    <div class="result-footer-text">
      <div class="impact-text-1" id="res-line1">今日はみんなの人気者！</div>
      <div class="impact-text-2" id="res-line2">〜相性抜群のパートナー〜</div>
      <button class="retry-btn" onclick="restartGame()">もう一度占う ✨</button>
    </div>
  </div>

  <script>
    /* =========================================================
       ★ ゲーム設定（質問や結果文言はここを自由に編集）★
       ========================================================= */
    const GAME_DATA = {
      questions: [
        {
          text: "休日に突然丸一日予定が空いたらどうする？",
          choices: [
            { label: "美容DAY！エステやネイルに行く 💅", type: "A" },
            { label: "推し活か友達とおしゃれカフェ ☕", type: "B" },
            { label: "Uber頼んでベッドから一歩も出ない 🛌", type: "C" }
          ]
        },
        {
          text: "LINEの返信スピード、ぶっちゃけ…",
          choices: [
            { label: "即レス派。通知溜まるとイライラする ⚡", type: "A" },
            { label: "気付いたら返す。基本マイペース 💭", type: "B" },
            { label: "未読スルー常習犯。数日後もザラ 🫠", type: "C" }
          ]
        },
        {
          text: "ご飯に行くお店を決めるときは？",
          choices: [
            { label: "インスタやTikTokで映え重視リサーチ 📸", type: "A" },
            { label: "その日の気分でパッと決める 🍽️", type: "B" },
            { label: "「どこでもいい〜決めて！」と丸投げ 🥺", type: "C" }
          ]
        },
        {
          text: "お買い物で一番テンション上がる瞬間は？",
          choices: [
            { label: "新作コスメやアクセを一目惚れ買い 💄", type: "A" },
            { label: "セールで欲しかったものが安くなってた時 🛍️", type: "B" },
            { label: "深夜のノリでポチった通販が届いた時 📦", type: "C" }
          ]
        },
        {
          text: "好きな人と話してて一番グッとくるのは？",
          choices: [
            { label: "髪型やネイルの変化に秒で気づいてくれる ✨", type: "A" },
            { label: "とにかく笑わせてくれて沈黙が気まずくない 😆", type: "B" },
            { label: "何でも肯定して甘やかしてくれる 🥰", type: "C" }
          ]
        },
        {
          text: "遅刻確定のピンチ！どうする？",
          choices: [
            { label: "即LINE！正直に状況言って平謝り 🙇‍♀️", type: "A" },
            { label: "タクシー飛ばして1分でも縮める 🚕", type: "B" },
            { label: "「ちょっと電車遅れてて…」と濁す 🤫", type: "C" }
          ]
        },
        {
          text: "お酒を飲んだときのテンションは？",
          choices: [
            { label: "テンションMAXでずっと喋って笑ってる 🍾", type: "A" },
            { label: "ふわふわ甘えん坊モードになる 🥺", type: "B" },
            { label: "眠くなって急に帰りたくなる 🥱", type: "C" }
          ]
        },
        {
          text: "旅行に行くときのパッキングは？",
          choices: [
            { label: "ヘアアイロンもお洋服もフル装備で大荷物 🧳", type: "A" },
            { label: "最低限のコスメだけ持っていく 🧴", type: "B" },
            { label: "出発1時間前に適当に詰め込む 💨", type: "C" }
          ]
        },
        {
          text: "今日のご褒美ディナーならどれ？",
          choices: [
            { label: "とろける極上焼肉 🥩", type: "A" },
            { label: "贅沢カウンターお寿司 🍣", type: "B" },
            { label: "夜パフェ・あま〜いスイーツ 🍨", type: "C" }
          ]
        },
        /* ★オチの第10問★ */
        {
          text: "【究極の選択】正直、きのこ派？たけのこ派？",
          choices: [
            { label: "絶対にきのこの山！ 🍄", type: "A" },
            { label: "愚問、たけのこの里一択！ 🎍", type: "B" },
            { label: "アルフォートしか勝たん 🍫", type: "C" }
          ]
        }
      ],

      results: {
        A: {
          tag: "#きょうの相性診断",
          title: "運命のソウルメイト",
          cornerFace: "💖",
          rank: "大吉",
          char: "🐼", /* "images/panda.png" などの画像パスも指定可能 */
          bgColors: ["#ff7597", "#f783ac"],
          line1: "相性120%！前世から双子レベル！",
          line2: "〜ノリもツボも完全一致〜"
        },
        B: {
          tag: "#きょうの相性診断",
          title: "前世の宿敵",
          cornerFace: "💀",
          rank: "大凶",
          char: "👿",
          bgColors: ["#e53e3e", "#721c24"],
          line1: "相性0%！奇跡のすれ違い！",
          line2: "〜絶対に分かり合えない天敵〜"
        },
        C: {
          tag: "#きょうの相性診断",
          title: "程よい仲良し",
          cornerFace: "🥂",
          rank: "中吉",
          char: "🗿",
          bgColors: ["#b197fc", "#7950f2"],
          line1: "相性65%！適度な距離感！",
          line2: "〜たまに飲みに行くと一番楽しい関係〜"
        }
      }
    };

    /* =========================================================
       マップ構造（8問目まで5列展開 ➔ 9問目で合流 ➔ 10問目で🔥）
       ========================================================= */
    const TOTAL_STEPS = 10;
    const NODE_SPACING_X = 130;
    const SVG_HEIGHT = 260;
    const CENTER_Y = SVG_HEIGHT / 2;
    const ROW_OFFSET = 38;

    const STEP_ROWS = [
      [0],               // 0: スタート
      [-1, 0, 1],        // 1
      [-1, 0, 1],        // 2
      [-2, -1, 0, 1, 2], // 3
      [-2, -1, 0, 1, 2], // 4
      [-2, -1, 0, 1, 2], // 5
      [-2, -1, 0, 1, 2], // 6
      [-2, -1, 0, 1, 2], // 7
      [-2, -1, 0, 1, 2], // 8（ワイド展開キープ）
      [0],               // 9（一斉合流）
      [0]                // 10（ゴール：🔥）
    ];

    // 女子ウケする可愛いモチーフプール
    const ICONS_POOL = ["🍾", "💄", "🎀", "💎", "🍓", "💖", "💅", "👑", "🥂"];

    let nodes = {};
    let edges = [];

    for (let step = 0; step <= TOTAL_STEPS; step++) {
      const rows = STEP_ROWS[step];
      rows.forEach(r => {
        const id = `${step}_${r}`;
        let icon = "✨";
        if (step === 0) icon = "🚩";
        else if (step === TOTAL_STEPS) icon = "🔥";
        else icon = ICONS_POOL[(step * 2 + Math.abs(r)) % ICONS_POOL.length];

        nodes[id] = {
          id: id,
          step: step,
          row: r,
          x: 60 + step * NODE_SPACING_X,
          y: CENTER_Y + r * ROW_OFFSET,
          icon: icon
        };
      });
    }

    for (let step = 0; step < TOTAL_STEPS; step++) {
      const currentRows = STEP_ROWS[step];
      const nextRows = STEP_ROWS[step + 1];

      currentRows.forEach(cr => {
        const fromId = `${step}_${cr}`;
        nextRows.forEach(nr => {
          if (nextRows.length === 1) {
            edges.push({ from: fromId, to: `${step+1}_0` });
          } else if (Math.abs(cr - nr) <= 1) {
            edges.push({ from: fromId, to: `${step+1}_${nr}` });
          }
        });
      });
    }

    /* =========================================================
       マップ描画（クリスタル調ノード＆ネオンライン）
       ========================================================= */
    const svg = document.getElementById('map-svg');

    // 接続ラインの描画
    edges.forEach(e => {
      const n1 = nodes[e.from];
      const n2 = nodes[e.to];
      const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
      line.setAttribute("x1", n1.x);
      line.setAttribute("y1", n1.y);
      line.setAttribute("x2", n2.x);
      line.setAttribute("y2", n2.y);
      line.setAttribute("stroke", "rgba(255, 182, 193, 0.25)");
      line.setAttribute("stroke-width", "2.5");
      line.setAttribute("stroke-dasharray", "4,4");
      line.setAttribute("id", `edge-${e.from}-${e.to}`);
      svg.appendChild(line);
    });

    // ノード描画（ぷっくりサークル）
    Object.values(nodes).forEach(n => {
      const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
      g.setAttribute("id", `node-${n.id}`);

      const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      circle.setAttribute("cx", n.x);
      circle.setAttribute("cy", n.y);
      circle.setAttribute("r", "19");
      circle.setAttribute("fill", n.step === TOTAL_STEPS ? "#ff7597" : "rgba(255, 255, 255, 0.12)");
      circle.setAttribute("stroke", n.step === TOTAL_STEPS ? "#ffffff" : "rgba(255, 255, 255, 0.4)");
      circle.setAttribute("stroke-width", "2");
      g.appendChild(circle);

      const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
      text.setAttribute("x", n.x);
      text.setAttribute("y", n.y + 6);
      text.setAttribute("text-anchor", "middle");
      text.setAttribute("font-size", n.step === TOTAL_STEPS ? "18" : "15");
      text.textContent = n.icon;
      g.appendChild(text);

      svg.appendChild(g);
    });

    /* =========================================================
       ゲーム進行ロジック
       ========================================================= */
    let currentStep = 0;
    let currentRow = 0;
    let lastChoiceType = "A";

    function updatePlayerPosition() {
      const currentNodeId = `${currentStep}_${currentRow}`;
      const node = nodes[currentNodeId];
      const avatar = document.getElementById('player-avatar');

      avatar.style.left = `${node.x}px`;
      avatar.style.top = `${node.y}px`;

      const container = document.getElementById('map-container');
      const targetScroll = node.x - container.clientWidth / 2;
      container.scrollTo({ left: Math.max(0, targetScroll), behavior: 'smooth' });

      // 通過ノードをネオンピンクに点灯
      const nodeEl = document.getElementById(`node-${currentNodeId}`);
      if (nodeEl) {
        nodeEl.querySelector('circle').setAttribute('fill', '#ff7597');
        nodeEl.querySelector('circle').setAttribute('stroke', '#ffffff');
      }
    }

    function renderQuestion() {
      if (currentStep >= TOTAL_STEPS) {
        showFinalResult();
        return;
      }

      const q = GAME_DATA.questions[currentStep];
      document.getElementById('q-number').textContent = `QUESTION ${String(currentStep + 1).padStart(2, '0')}`;
      document.getElementById('progress-text').textContent = `残り ${TOTAL_STEPS - currentStep} 問`;
      document.getElementById('q-text').textContent = q.text;

      const choicesBox = document.getElementById('choices-container');
      choicesBox.innerHTML = '';

      q.choices.forEach(c => {
        const card = document.createElement('div');
        card.className = `choice-card type-${c.type}`;
        card.innerHTML = `
          <div class="choice-badge">${c.type}</div>
          <div class="choice-text">${c.label}</div>
        `;
        card.onclick = () => selectChoice(c.type);
        choicesBox.appendChild(card);
      });
    }

    function selectChoice(type) {
      lastChoiceType = type;
      const nextStep = currentStep + 1;

      let nextRow = 0;
      if (nextStep < 9) {
        const candidateRows = STEP_ROWS[nextStep];
        let idealRow = currentRow;
        if (type === 'A') idealRow -= 1;
        if (type === 'C') idealRow += 1;

        nextRow = candidateRows.reduce((prev, curr) =>
          Math.abs(curr - idealRow) < Math.abs(prev - idealRow) ? curr : prev
        );
      }

      // エッジのネオンハイライト
      const edgeId = `edge-${currentStep}_${currentRow}-${nextStep}_${nextRow}`;
      const edgeEl = document.getElementById(edgeId);
      if (edgeEl) {
        edgeEl.setAttribute('stroke', '#ff7597');
        edgeEl.setAttribute('stroke-width', '3.5');
        edgeEl.removeAttribute('stroke-dasharray');
      }

      currentStep = nextStep;
      currentRow = nextRow;

      updatePlayerPosition();

      if (currentStep < TOTAL_STEPS) {
        renderQuestion();
      } else {
        setTimeout(showFinalResult, 600);
      }
    }

    function renderCharContent(charVal) {
      if (typeof charVal === 'string' && (charVal.includes('/') || charVal.endsWith('.png') || charVal.endsWith('.jpg') || charVal.endsWith('.webp'))) {
        return `<img src="${charVal}" alt="character">`;
      }
      return charVal;
    }

    function showFinalResult() {
      const res = GAME_DATA.results[lastChoiceType] || GAME_DATA.results.A;
      const modal = document.getElementById('result-modal');

      document.getElementById('spiral-bg').style.setProperty('--res-bg-1', res.bgColors[0]);
      document.getElementById('spiral-bg').style.setProperty('--res-bg-2', res.bgColors[1]);

      document.getElementById('res-tag').textContent = res.tag;
      document.getElementById('res-title').textContent = res.title;
      document.getElementById('res-corner-face').innerHTML = renderCharContent(res.cornerFace);
      document.getElementById('res-rank').textContent = res.rank;
      document.getElementById('res-char').innerHTML = renderCharContent(res.char);
      document.getElementById('res-line1').textContent = res.line1;
      document.getElementById('res-line2').textContent = res.line2;

      modal.style.display = 'flex';
    }

    function restartGame() {
      location.reload();
    }

    window.onload = () => {
      updatePlayerPosition();
      renderQuestion();
    };
  </script>
</body>
</html>
