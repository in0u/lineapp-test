<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>相性診断マップ</title>
<style>
:root {
  --bg: #111225;
  --panel: #1d1d38;
  --panel2: #272646;
  --pink: #ff4fa3;
  --pink2: #ff8ac5;
  --purple: #8b6cff;
  --gold: #ffd76a;
  --mint: #63f5d1;
  --text: #fff8fd;
  --muted: #aaa9c5;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}
html, body {
  min-height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow-x: hidden;
  user-select: none;
  -webkit-user-select: none;
}
button { font: inherit; }

.app {
  min-height: 100vh;
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(circle at 15% 8%, rgba(255,79,163,.20), transparent 25%),
    radial-gradient(circle at 88% 12%, rgba(139,108,255,.22), transparent 27%),
    linear-gradient(160deg, #101124 0%, #18162f 55%, #24152e 100%);
}

/* トップバー */
.topbar {
  height: 60px;
  padding: 0 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: relative;
  z-index: 10;
  border-bottom: 1px solid rgba(255,255,255,.08);
  background: rgba(10,10,25,.65);
  backdrop-filter: blur(18px);
}
.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 900;
  letter-spacing: .05em;
}
.logo-badge {
  width: 36px;
  height: 36px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  background: linear-gradient(145deg, var(--pink), #9c55ff);
  box-shadow: 0 5px 20px rgba(255,79,163,.35);
  font-size: 20px;
}
.logo small {
  display: block;
  color: var(--pink2);
  font-size: 10px;
  letter-spacing: .15em;
}
.counter-box {
  font-size: 13px;
  color: #d9d6ed;
}
.counter-box b {
  color: var(--gold);
  font-size: 17px;
  margin-left: 4px;
}

/* クイズ画面 */
.screen {
  position: relative;
  z-index: 1;
  max-width: 1000px;
  margin: auto;
  padding: 14px 16px 36px;
}

.hero {
  text-align: center;
  margin: 4px 0 14px;
}
.kicker {
  font-size: 10px;
  letter-spacing: .24em;
  color: var(--pink2);
  font-weight: 800;
}
h1 {
  margin: 4px 0 0;
  font-size: clamp(20px, 3.5vw, 30px);
  letter-spacing: .05em;
}
.subtitle {
  margin: 3px 0 0;
  color: var(--muted);
  font-size: 12px;
}

/* マップカード */
.map-card {
  position: relative;
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 24px;
  padding: 12px 8px;
  background: linear-gradient(180deg, rgba(42,40,76,.88), rgba(20,20,42,.88));
  box-shadow: 0 25px 70px rgba(0,0,0,.38), inset 0 1px rgba(255,255,255,.08);
  overflow-x: auto;
  overflow-y: hidden;
  scroll-behavior: smooth;
}
#map-svg {
  height: 250px;
  min-width: 1450px;
  display: block;
}

/* 主人公キャラ */
#player-avatar {
  position: absolute;
  width: 52px;
  height: 52px;
  transform: translate(-50%, -50%);
  transition: left 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), top 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  pointer-events: none;
  z-index: 25;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: playerFloat 1.2s infinite alternate ease-in-out;
}
.avatar-ring {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  border: 3px solid #ffffff;
  background: linear-gradient(145deg, var(--gold), var(--pink));
  box-shadow: 0 0 0 4px rgba(255,215,106,.25), 0 0 25px rgba(255,79,163,.6);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}
.avatar-ring img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.avatar-fallback {
  font-size: 24px;
}
@keyframes playerFloat {
  0% { transform: translate(-50%, -75%); }
  100% { transform: translate(-50%, -95%); }
}

/* 質問カード */
.question-card {
  margin-top: 14px;
  border-radius: 22px;
  padding: 18px;
  background: rgba(255,255,255,.055);
  border: 1px solid rgba(255,255,255,.11);
  box-shadow: 0 16px 45px rgba(0,0,0,.22);
}
.q-top {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
}
.q-num {
  font-size: 11px;
  font-weight: 900;
  letter-spacing: .15em;
  color: var(--pink2);
  white-space: nowrap;
}
.progress {
  height: 5px;
  flex: 1;
  border-radius: 10px;
  background: #34334e;
  overflow: hidden;
}
.progress i {
  display: block;
  width: 10%;
  height: 100%;
  background: linear-gradient(90deg, var(--pink), var(--purple));
  border-radius: inherit;
  transition: width 0.3s ease;
}
.question {
  font-size: clamp(15px, 2.2vw, 20px);
  font-weight: 900;
  letter-spacing: .03em;
  margin-bottom: 14px;
  line-height: 1.45;
}

/* 選択肢ボタン */
.answers {
  display: grid;
  gap: 10px;
}
.answer {
  position: relative;
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  min-height: 56px;
  padding: 10px 16px;
  border: 1px solid rgba(255,255,255,.11);
  border-radius: 16px;
  color: white;
  background: linear-gradient(100deg, rgba(255,255,255,.075), rgba(255,255,255,.035));
  text-align: left;
  cursor: pointer;
  transition: .18s;
  box-shadow: 0 7px 20px rgba(0,0,0,.16);
}
.answer:active, .answer:hover {
  transform: translateY(-2px);
  border-color: rgba(255,79,163,.6);
  background: linear-gradient(100deg, rgba(255,79,163,.18), rgba(139,108,255,.12));
  box-shadow: 0 10px 25px rgba(255,79,163,.12);
}
.answer .letter {
  width: 32px;
  height: 32px;
  flex: none;
  border-radius: 10px;
  display: grid;
  place-items: center;
  font-weight: 900;
  font-size: 14px;
  background: linear-gradient(145deg, var(--pink), #b54fff);
  box-shadow: 0 5px 14px rgba(255,79,163,.28);
}
.answer.type-B .letter { background: linear-gradient(145deg, #da77f2, #be4bdb); }
.answer.type-C .letter { background: linear-gradient(145deg, #ffa94d, #ff922b); }
.answer .ans-text { font-size: 13px; font-weight: 700; line-height: 1.35; }
.answer .spark { margin-left: auto; color: var(--gold); opacity: .7; }

/* =========================================================
   結果画面モーダル（t3デザインの完全再現）
   ========================================================= */
#result-modal {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding: 35px 20px 25px;
  overflow: hidden;
  animation: modalFadeIn 0.4s ease forwards;
}
@keyframes modalFadeIn {
  from { opacity: 0; transform: scale(0.95); }
  to { opacity: 1; transform: scale(1); }
}

/* ぐるぐる渦巻きアニメーション背景 */
.spiral-bg {
  position: absolute;
  inset: -100%;
  width: 300%;
  height: 300%;
  background: repeating-conic-gradient(
    var(--res-bg-1, #e53e3e) 0deg 15deg,
    var(--res-bg-2, #721c24) 15deg 30deg
  );
  animation: rotateSpiral 22s linear infinite;
  z-index: 1;
}
@keyframes rotateSpiral {
  100% { transform: rotate(360deg); }
}

/* 上部：ちぎり紙風バナー */
.paper-banner {
  position: relative;
  z-index: 10;
  background: #ffffff;
  padding: 10px 28px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.3);
  border-radius: 4px;
  transform: rotate(-3deg);
  border: 2px dashed #333333;
  text-align: center;
  max-width: 90%;
}
.paper-banner .tag {
  color: #2b8a3e;
  font-size: 15px;
  font-weight: 900;
  letter-spacing: 1px;
}
.paper-banner .main-title {
  font-size: 26px;
  font-weight: 900;
  color: #1a1a1a;
  margin-top: 2px;
}
.corner-face {
  position: absolute;
  right: -20px;
  top: -24px;
  font-size: 38px;
  transform: rotate(12deg);
}

/* 中央：満月サークル ＋ キャラ ＋ 特大フチ文字 */
.character-area {
  position: relative;
  z-index: 10;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.rank-text {
  position: absolute;
  top: -32px;
  left: -24px;
  font-size: 44px;
  font-weight: 900;
  color: #ffffff;
  -webkit-text-stroke: 3px #000000;
  text-shadow: 4px 4px 0 #000000;
  transform: rotate(-10deg);
  z-index: 15;
  white-space: nowrap;
}
.yellow-circle {
  width: 210px;
  height: 210px;
  background: radial-gradient(circle, #fff3bf 55%, #ffd43b 100%);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 10px 30px rgba(0,0,0,0.35);
  border: 4px solid #ffffff;
  overflow: hidden;
}
.main-character {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: charPulse 1.2s infinite alternate ease-in-out;
}
.main-character img {
  width: 85%;
  height: 85%;
  object-fit: contain;
}
.main-character .char-emoji {
  font-size: 90px;
}
@keyframes charPulse {
  0% { transform: scale(1); }
  100% { transform: scale(1.05); }
}

/* 下部：黒フチ極太文字＆リトライボタン */
.result-footer-text {
  position: relative;
  z-index: 10;
  text-align: center;
}
.impact-text-1 {
  font-size: 21px;
  font-weight: 900;
  color: #ffea00;
  -webkit-text-stroke: 2px #000000;
  text-shadow: 3px 3px 0 #000000;
  margin-bottom: 4px;
}
.impact-text-2 {
  font-size: 19px;
  font-weight: 900;
  color: #ffffff;
  -webkit-text-stroke: 2px #000000;
  text-shadow: 3px 3px 0 #000000;
}
.retry-btn {
  position: relative;
  z-index: 10;
  margin-top: 14px;
  background: #ffffff;
  border: 3px solid #000000;
  color: #000000;
  font-size: 16px;
  font-weight: 900;
  padding: 10px 34px;
  border-radius: 30px;
  box-shadow: 0 5px 0 #000000;
  cursor: pointer;
  outline: none;
}
.retry-btn:active {
  transform: translateY(3px);
  box-shadow: 0 2px 0 #000000;
}
</style>
</head>

<div class="app">

  <!-- トップバー -->

      </div>
    </div>

    <!-- 下部：黒フチ袋文字＆リトライ -->
    <div class="result-footer-text">
      <div class="impact-text-1" id="res-line1">相性0%！奇跡のすれ違い！</div>
      <div class="impact-text-2" id="res-line2">〜前世からの宿敵〜</div>
      <button class="retry-btn" onclick="restartGame()">もう一度占う ✨</button>

</div>

<script>
/* =========================================================
   ★ ゲームデータ（質問・選択肢・結果文言・色設定）★

const GAME_DATA = {

/* =========================================================
   マップ構造（8問目まで5列展開 ➔ 9問目中央集結 ➔ 10問目🔥）
   ========================================================= */
const TOTAL_STEPS = 10;
const NODE_SPACING_X = 130;
const SVG_HEIGHT = 250;
const CENTER_Y = SVG_HEIGHT / 2;
const ROW_OFFSET = 38;

const STEP_ROWS = [
  [0],               // 0: スタート
  [-1, 0, 1],        // 1
  [-1, 0, 1],        // 2
  [-2, -1, 0, 1, 2], // 3
  [-2, -1, 0, 1, 2], // 4
  [-2, -1, 0, 1, 2], // 5
  [-2, -1, 0, 1, 2], // 6
  [-2, -1, 0, 1, 2], // 7
  [-2, -1, 0, 1, 2], // 8（ワイドキープ）
  [0],               // 9（一斉合流）
  [0]                // 10（完全収束：🔥ボスノード）
];

const ICONS_POOL = ["🍾", "💄", "🎀", "💎", "🍓", "💖", "💅", "👑", "🥂"];

let nodes = {};
let edges = [];

for (let step = 0; step <= TOTAL_STEPS; step++) {
  const rows = STEP_ROWS[step];
  rows.forEach(r => {
    const id = `${step}_${r}`;
    let icon = "✨";
    if (step === 0) icon = "🚩";
    else if (step === TOTAL_STEPS) icon = "🔥";
    else icon = ICONS_POOL[(step * 2 + Math.abs(r)) % ICONS_POOL.length];

    nodes[id] = {
      id: id,
      step: step,
      row: r,
      x: 60 + step * NODE_SPACING_X,
      y: CENTER_Y + r * ROW_OFFSET,
      icon: icon
    };
  });
}

for (let step = 0; step < TOTAL_STEPS; step++) {
  const currentRows = STEP_ROWS[step];
  const nextRows = STEP_ROWS[step + 1];

  currentRows.forEach(cr => {
    const fromId = `${step}_${cr}`;
    nextRows.forEach(nr => {
      if (nextRows.length === 1) {
        edges.push({ from: fromId, to: `${step+1}_0` });
      } else if (Math.abs(cr - nr) <= 1) {
        edges.push({ from: fromId, to: `${step+1}_${nr}` });
      }
    });
  });
}

/* =========================================================
   マップ描画（SVG）
   ========================================================= */
const svg = document.getElementById('map-svg');

edges.forEach(e => {
  const n1 = nodes[e.from];
  const n2 = nodes[e.to];
  const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
  line.setAttribute("x1", n1.x);
  line.setAttribute("y1", n1.y);
  line.setAttribute("x2", n2.x);
  line.setAttribute("y2", n2.y);
  line.setAttribute("stroke", "rgba(255, 79, 163, 0.22)");
  line.setAttribute("stroke-width", "2.5");
  line.setAttribute("stroke-dasharray", "4,4");
  line.setAttribute("id", `edge-${e.from}-${e.to}`);
  svg.appendChild(line);
});

Object.values(nodes).forEach(n => {
  const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
  g.setAttribute("id", `node-${n.id}`);

  const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
  rect.setAttribute("x", n.x - 18);
  rect.setAttribute("y", n.y - 18);
  rect.setAttribute("width", "36");
  rect.setAttribute("height", "36");
  rect.setAttribute("rx", "12");
  rect.setAttribute("fill", n.step === TOTAL_STEPS ? "#ff5b95" : "#1d1d38");
  rect.setAttribute("stroke", n.step === TOTAL_STEPS ? "#ffd4e5" : "rgba(255,255,255,0.18)");
  rect.setAttribute("stroke-width", "1.5");
  g.appendChild(rect);

  const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
  text.setAttribute("x", n.x);
  text.setAttribute("y", n.y + 6);
  text.setAttribute("text-anchor", "middle");
  text.setAttribute("font-size", n.step === TOTAL_STEPS ? "18" : "15");
  text.textContent = n.icon;
  g.appendChild(text);

  svg.appendChild(g);
});

/* =========================================================
   ゲーム進行ロジック
   ========================================================= */
let currentStep = 0;
let currentRow = 0;
let lastChoiceType = "B"; // デフォルト

function updatePlayerPosition() {
  const currentNodeId = `${currentStep}_${currentRow}`;
  const node = nodes[currentNodeId];
  const avatar = document.getElementById('player-avatar');

  avatar.style.left = `${node.x}px`;
  avatar.style.top = `${node.y}px`;

  const container = document.getElementById('map-container');
  const targetScroll = node.x - container.clientWidth / 2;
  container.scrollTo({ left: Math.max(0, targetScroll), behavior: 'smooth' });

  const nodeEl = document.getElementById(`node-${currentNodeId}`);
  if (nodeEl) {
    const rect = nodeEl.querySelector('rect');
    rect.setAttribute('fill', '#4b294f');
    rect.setAttribute('stroke', 'rgba(255,79,163,.6)');
  }
}

function renderQuestion() {
  if (currentStep >= TOTAL_STEPS) {
    showFinalResult();
    return;
  }

  const q = GAME_DATA.questions[currentStep];
  document.getElementById('q-num').textContent = `QUESTION ${String(currentStep + 1).padStart(2, '0')}`;
  document.getElementById('timer').textContent = TOTAL_STEPS - currentStep;
  document.getElementById('progress-bar').style.width = `${((currentStep + 1) / TOTAL_STEPS) * 100}%`;
  document.getElementById('q-text').textContent = q.text;

  const choicesBox = document.getElementById('choices-container');
  choicesBox.innerHTML = '';

  q.choices.forEach(c => {
    const btn = document.createElement('div');
    btn.className = `answer type-${c.type}`;
    btn.innerHTML = `
      <div class="letter">${c.type}</div>
      <div class="ans-text">${c.label}</div>
      <div class="spark">✦</div>
    `;
    btn.onclick = () => selectChoice(c.type);
    choicesBox.appendChild(btn);
  });
}

function selectChoice(type) {
  lastChoiceType = type;
  const nextStep = currentStep + 1;

  let nextRow = 0;
  if (nextStep < 9) {
    const candidateRows = STEP_ROWS[nextStep];
    let idealRow = currentRow;
    if (type === 'A') idealRow -= 1;
    if (type === 'C') idealRow += 1;

    nextRow = candidateRows.reduce((prev, curr) =>
      Math.abs(curr - idealRow) < Math.abs(prev - idealRow) ? curr : prev
    );
  }

  const edgeId = `edge-${currentStep}_${currentRow}-${nextStep}_${nextRow}`;
  const edgeEl = document.getElementById(edgeId);
  if (edgeEl) {
    edgeEl.setAttribute('stroke', '#ff4fa3');
    edgeEl.setAttribute('stroke-width', '3.5');
    edgeEl.removeAttribute('stroke-dasharray');
  }

  currentStep = nextStep;
  currentRow = nextRow;

  updatePlayerPosition();

  if (currentStep < TOTAL_STEPS) {
    renderQuestion();
  } else {
    setTimeout(showFinalResult, 600);
  }
}

function showFinalResult() {
  const res = GAME_DATA.results[lastChoiceType] || GAME_DATA.results.B;
  const modal = document.getElementById('result-modal');

  // 背景の渦巻き色を設定
  document.getElementById('spiral-bg').style.setProperty('--res-bg-1', res.bgColors[0]);
  document.getElementById('spiral-bg').style.setProperty('--res-bg-2', res.bgColors[1]);

  // 上部ちぎり紙バナー
  document.getElementById('res-tag').textContent = res.tag;
  document.getElementById('res-title').textContent = res.title;
  document.getElementById('res-corner-face').textContent = res.cornerFace;

  // 中央：特大フチ文字とキャラ
  document.getElementById('res-rank').textContent = res.rank;

  const charImg = document.getElementById('res-char-img');
  const fallback = document.getElementById('res-char-fallback');
  if (res.img) {
    charImg.src = res.img;
    charImg.style.display = 'block';
    fallback.style.display = 'none';
  } else {
    charImg.style.display = 'none';
    fallback.style.display = 'block';
    fallback.textContent = res.fallbackEmoji;
  }

  // 下部：黒フチ袋文字
  document.getElementById('res-line1').textContent = res.line1;
  document.getElementById('res-line2').textContent = res.line2;

  // モーダル表示
  modal.style.display = 'flex';
}

function restartGame() {
  location.reload();
}

window.onload = () => {
  updatePlayerPosition();
  renderQuestion();
};
</script>
