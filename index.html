<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>相性診断マップ</title>
<style>
:root {
  --bg: #111225;
  --panel: #1d1d38;
  --panel2: #272646;
  --pink: #ff4fa3;
  --pink2: #ff8ac5;
  --purple: #8b6cff;
  --gold: #ffd76a;
  --mint: #63f5d1;
  --text: #fff8fd;
  --muted: #aaa9c5;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}
html, body {
  min-height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow-x: hidden;
  user-select: none;
  -webkit-user-select: none;
}
button { font: inherit; }

.app {
  min-height: 100vh;
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(circle at 15% 8%, rgba(255,79,163,.20), transparent 25%),
    radial-gradient(circle at 88% 12%, rgba(139,108,255,.22), transparent 27%),
    linear-gradient(160deg, #101124 0%, #18162f 55%, #24152e 100%);
}
.app:before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: .15;
  background-image: radial-gradient(#fff 1px, transparent 1px);
  background-size: 27px 27px;
  mask-image: linear-gradient(to bottom, black, transparent 75%);
}

/* トップバー */
.topbar {
  height: 60px;
  padding: 0 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: relative;
  z-index: 10;
  border-bottom: 1px solid rgba(255,255,255,.08);
  background: rgba(10,10,25,.65);
  backdrop-filter: blur(18px);
}
.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 900;
  letter-spacing: .05em;
}
.logo-badge {
  width: 36px;
  height: 36px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  background: linear-gradient(145deg, var(--pink), #9c55ff);
  box-shadow: 0 5px 20px rgba(255,79,163,.35);
  font-size: 20px;
}
.logo small {
  display: block;
  color: var(--pink2);
  font-size: 10px;
  letter-spacing: .15em;
}
.counter-box {
  font-size: 13px;
  color: #d9d6ed;
}
.counter-box b {
  color: var(--gold);
  font-size: 17px;
  margin-left: 4px;
}

/* 画面共通 */
.screen {
  position: relative;
  z-index: 1;
  max-width: 1000px;
  margin: auto;
  padding: 14px 16px 36px;
}

.hero {
  text-align: center;
  margin: 4px 0 14px;
}
.kicker {
  font-size: 10px;
  letter-spacing: .24em;
  color: var(--pink2);
  font-weight: 800;
}
h1 {
  margin: 4px 0 0;
  font-size: clamp(20px, 3.5vw, 30px);
  letter-spacing: .05em;
}
.subtitle {
  margin: 3px 0 0;
  color: var(--muted);
  font-size: 12px;
}

/* マップカード（8問目まで5列展開 ➔ 9問目で中央集結 ➔ 10問目🔥） */
.map-card {
  position: relative;
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 24px;
  padding: 12px 8px;
  background: linear-gradient(180deg, rgba(42,40,76,.88), rgba(20,20,42,.88));
  box-shadow: 0 25px 70px rgba(0,0,0,.38), inset 0 1px rgba(255,255,255,.08);
  overflow-x: auto;
  overflow-y: hidden;
  scroll-behavior: smooth;
}
#map-svg {
  height: 250px;
  min-width: 1450px;
  display: block;
}

/* 主人公キャラ */
#player-avatar {
  position: absolute;
  width: 52px;
  height: 52px;
  transform: translate(-50%, -50%);
  transition: left 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), top 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  pointer-events: none;
  z-index: 25;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: playerFloat 1.2s infinite alternate ease-in-out;
}
.avatar-ring {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  border: 3px solid #ffffff;
  background: linear-gradient(145deg, var(--gold), var(--pink));
  box-shadow: 0 0 0 4px rgba(255,215,106,.25), 0 0 25px rgba(255,79,163,.6);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}
.avatar-ring img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.avatar-fallback {
  font-size: 24px;
}
@keyframes playerFloat {
  0% { transform: translate(-50%, -75%); }
  100% { transform: translate(-50%, -95%); }
}

/* 質問カード */
.question-card {
  margin-top: 14px;
  border-radius: 22px;
  padding: 18px;
  background: rgba(255,255,255,.055);
  border: 1px solid rgba(255,255,255,.11);
  box-shadow: 0 16px 45px rgba(0,0,0,.22);
}
.q-top {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
}
.q-num {
  font-size: 11px;
  font-weight: 900;
  letter-spacing: .15em;
  color: var(--pink2);
  white-space: nowrap;
}
.progress {
  height: 5px;
  flex: 1;
  border-radius: 10px;
  background: #34334e;
  overflow: hidden;
}
.progress i {
  display: block;
  width: 10%;
  height: 100%;
  background: linear-gradient(90deg, var(--pink), var(--purple));
  border-radius: inherit;
  transition: width 0.3s ease;
}
.question {
  font-size: clamp(15px, 2.2vw, 20px);
  font-weight: 900;
  letter-spacing: .03em;
  margin-bottom: 14px;
  line-height: 1.45;
}

/* 選択肢ボタン */
.answers {
  display: grid;
  gap: 10px;
}
.answer {
  position: relative;
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  min-height: 56px;
  padding: 10px 16px;
  border: 1px solid rgba(255,255,255,.11);
  border-radius: 16px;
  color: white;
  background: linear-gradient(100deg, rgba(255,255,255,.075), rgba(255,255,255,.035));
  text-align: left;
  cursor: pointer;
  transition: .18s;
  box-shadow: 0 7px 20px rgba(0,0,0,.16);
}
.answer:active, .answer:hover {
  transform: translateY(-2px);
  border-color: rgba(255,79,163,.6);
  background: linear-gradient(100deg, rgba(255,79,163,.18), rgba(139,108,255,.12));
  box-shadow: 0 10px 25px rgba(255,79,163,.12);
}
.answer .letter {
  width: 32px;
  height: 32px;
  flex: none;
  border-radius: 10px;
  display: grid;
  place-items: center;
  font-weight: 900;
  font-size: 14px;
  background: linear-gradient(145deg, var(--pink), #b54fff);
  box-shadow: 0 5px 14px rgba(255,79,163,.28);
}
.answer.type-B .letter { background: linear-gradient(145deg, #da77f2, #be4bdb); }
.answer.type-C .letter { background: linear-gradient(145deg, #ffa94d, #ff922b); }
.answer .ans-text { font-size: 13px; font-weight: 700; line-height: 1.35; }
.answer .spark { margin-left: auto; color: var(--gold); opacity: .7; }

/* =========================================================
   デザイナー作：結果画面（ferret_compatibility_ui.html準拠）
   ========================================================= */
.result-section {
  min-height: calc(100vh - 60px);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px 16px 40px;
  position: relative;
  z-index: 10;
}
.result-section.active {
  display: flex;
}
.result-box {
  width: min(640px, 100%);
  text-align: center;
  position: relative;
  padding: 34px 22px 38px;
  border-radius: 36px;
  background: linear-gradient(160deg, rgba(45,35,72,.95), rgba(20,20,40,.96));
  border: 1px solid rgba(255,255,255,.14);
  box-shadow: 0 30px 100px rgba(0,0,0,.55);
}
.result-box:before {
  content: "";
  position: absolute;
  inset: -2px;
  border-radius: 38px;
  padding: 2px;
  background: linear-gradient(120deg, transparent 15%, rgba(255,79,163,.75), rgba(255,215,106,.7), transparent 75%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
}
.stars {
  font-size: 20px;
  letter-spacing: .35em;
  color: var(--gold);
  margin-bottom: 8px;
}
.result-tag {
  display: inline-block;
  padding: 6px 16px;
  border-radius: 999px;
  background: rgba(255,79,163,.15);
  border: 1px solid rgba(255,79,163,.35);
  color: #ff9acb;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .15em;
}
.result-avatar {
  width: 150px;
  height: 150px;
  margin: 18px auto 12px;

  padding: 6px;
  background: linear-gradient(145deg, #fff1a8, #ff63aa, #8b6cff);
  box-shadow: 0 0 0 6px rgba(255,255,255,.06), 0 0 45px rgba(255,79,163,.45);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.result-avatar img {
  width: 100%;
  height: 100%;

}
.result-avatar .char-fallback {

}
.result-title {

  margin: 8px 0 4px;
  background: linear-gradient(90deg, #fff, #ffd2e9, #ffd76a);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.result-rank {
  font-size: 15px;
  font-weight: 900;
  color: var(--gold);
  margin-bottom: 12px;
  letter-spacing: .1em;
}
.result-copy {
  color: #c9c7da;
  font-size: 14px;
  line-height: 1.8;
  max-width: 90%;
  margin: 0 auto;
}
.cta {
  margin-top: 24px;
  border: 0;
  border-radius: 999px;
  padding: 14px 40px;
  font-weight: 900;
  font-size: 15px;
  color: #2a1830;
  background: linear-gradient(100deg, #ffd76a, #ff83bd);
  box-shadow: 0 10px 30px rgba(255,79,163,.3);
  cursor: pointer;
  transition: .15s;
}
.cta:active {
  transform: translateY(2px);
  box-shadow: 0 4px 15px rgba(255,79,163,.2);
}
</style>
</head>

const GAME_DATA = {

/* =========================================================
   マップ構造（8問目まで5列展開 ➔ 9問目中央集結 ➔ 10問目🔥）
   ========================================================= */
const TOTAL_STEPS = 10;
const NODE_SPACING_X = 130;
const SVG_HEIGHT = 250;
const CENTER_Y = SVG_HEIGHT / 2;
const ROW_OFFSET = 38;

const STEP_ROWS = [
  [0],               // 0: スタート
  [-1, 0, 1],        // 1
  [-1, 0, 1],        // 2
  [-2, -1, 0, 1, 2], // 3（5列）
  [-2, -1, 0, 1, 2], // 4
  [-2, -1, 0, 1, 2], // 5
  [-2, -1, 0, 1, 2], // 6
  [-2, -1, 0, 1, 2], // 7
  [-2, -1, 0, 1, 2], // 8（ワイドキープ）
  [0],               // 9（一斉合流）
  [0]                // 10（完全収束：🔥ボスノード）
];

const ICONS_POOL = ["🍾", "💄", "🎀", "💎", "🍓", "💖", "💅", "👑", "🥂"];

let nodes = {};
let edges = [];

for (let step = 0; step <= TOTAL_STEPS; step++) {
  const rows = STEP_ROWS[step];
  rows.forEach(r => {
    const id = `${step}_${r}`;
    let icon = "✨";
    if (step === 0) icon = "🚩";
    else if (step === TOTAL_STEPS) icon = "🔥";
    else icon = ICONS_POOL[(step * 2 + Math.abs(r)) % ICONS_POOL.length];

    nodes[id] = {
      id: id,
      step: step,
      row: r,
      x: 60 + step * NODE_SPACING_X,
      y: CENTER_Y + r * ROW_OFFSET,
      icon: icon
    };
  });
}

for (let step = 0; step < TOTAL_STEPS; step++) {
  const currentRows = STEP_ROWS[step];
  const nextRows = STEP_ROWS[step + 1];

  currentRows.forEach(cr => {
    const fromId = `${step}_${cr}`;
    nextRows.forEach(nr => {
      if (nextRows.length === 1) {
        edges.push({ from: fromId, to: `${step+1}_0` });
      } else if (Math.abs(cr - nr) <= 1) {
        edges.push({ from: fromId, to: `${step+1}_${nr}` });
      }
    });
  });
}

/* マップ描画 */
const svg = document.getElementById('map-svg');

edges.forEach(e => {
  const n1 = nodes[e.from];
  const n2 = nodes[e.to];
  const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
  line.setAttribute("x1", n1.x);
  line.setAttribute("y1", n1.y);
  line.setAttribute("x2", n2.x);
  line.setAttribute("y2", n2.y);
  line.setAttribute("stroke", "rgba(255, 79, 163, 0.22)");
  line.setAttribute("stroke-width", "2.5");
  line.setAttribute("stroke-dasharray", "4,4");
  line.setAttribute("id", `edge-${e.from}-${e.to}`);
  svg.appendChild(line);
});

Object.values(nodes).forEach(n => {
  const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
  g.setAttribute("id", `node-${n.id}`);

  const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
  rect.setAttribute("x", n.x - 18);
  rect.setAttribute("y", n.y - 18);
  rect.setAttribute("width", "36");
  rect.setAttribute("height", "36");
  rect.setAttribute("rx", "12");
  rect.setAttribute("fill", n.step === TOTAL_STEPS ? "linear-gradient(145deg,#ff5b95,#ff7b56)" : "#1d1d38");
  rect.setAttribute("stroke", n.step === TOTAL_STEPS ? "#ffd4e5" : "rgba(255,255,255,0.18)");
  rect.setAttribute("stroke-width", "1.5");
  g.appendChild(rect);

  const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
  text.setAttribute("x", n.x);
  text.setAttribute("y", n.y + 6);
  text.setAttribute("text-anchor", "middle");
  text.setAttribute("font-size", n.step === TOTAL_STEPS ? "18" : "15");
  text.textContent = n.icon;
  g.appendChild(text);

  svg.appendChild(g);
});

/* ゲーム進行 */
let currentStep = 0;
let currentRow = 0;
let lastChoiceType = "B";

function updatePlayerPosition() {
  const currentNodeId = `${currentStep}_${currentRow}`;
  const node = nodes[currentNodeId];
  const avatar = document.getElementById('player-avatar');

  avatar.style.left = `${node.x}px`;
  avatar.style.top = `${node.y}px`;

  const container = document.getElementById('map-container');
  const targetScroll = node.x - container.clientWidth / 2;
  container.scrollTo({ left: Math.max(0, targetScroll), behavior: 'smooth' });

  const nodeEl = document.getElementById(`node-${currentNodeId}`);
  if (nodeEl) {
    const rect = nodeEl.querySelector('rect');
    rect.setAttribute('fill', '#4b294f');
    rect.setAttribute('stroke', 'rgba(255,79,163,.6)');
  }
}

function renderQuestion() {
  if (currentStep >= TOTAL_STEPS) {
    showFinalResult();
    return;
  }

  const q = GAME_DATA.questions[currentStep];
  document.getElementById('q-num').textContent = `QUESTION ${String(currentStep + 1).padStart(2, '0')}`;
  document.getElementById('timer').textContent = TOTAL_STEPS - currentStep;
  document.getElementById('progress-bar').style.width = `${((currentStep + 1) / TOTAL_STEPS) * 100}%`;
  document.getElementById('q-text').textContent = q.text;

  const choicesBox = document.getElementById('choices-container');
  choicesBox.innerHTML = '';

  q.choices.forEach(c => {
    const btn = document.createElement('div');
    btn.className = `answer type-${c.type}`;
    btn.innerHTML = `
      <div class="letter">${c.type}</div>
      <div class="ans-text">${c.label}</div>
      <div class="spark">✦</div>
    `;
    btn.onclick = () => selectChoice(c.type);
    choicesBox.appendChild(btn);
  });
}

function selectChoice(type) {
  lastChoiceType = type;
  const nextStep = currentStep + 1;

  let nextRow = 0;
  if (nextStep < 9) {
    const candidateRows = STEP_ROWS[nextStep];
    let idealRow = currentRow;
    if (type === 'A') idealRow -= 1;
    if (type === 'C') idealRow += 1;

    nextRow = candidateRows.reduce((prev, curr) =>
      Math.abs(curr - idealRow) < Math.abs(prev - idealRow) ? curr : prev
    );
  }

  const edgeId = `edge-${currentStep}_${currentRow}-${nextStep}_${nextRow}`;
  const edgeEl = document.getElementById(edgeId);
  if (edgeEl) {
    edgeEl.setAttribute('stroke', '#ff4fa3');
    edgeEl.setAttribute('stroke-width', '3.5');
    edgeEl.removeAttribute('stroke-dasharray');
  }

  currentStep = nextStep;
  currentRow = nextRow;

  updatePlayerPosition();

  if (currentStep < TOTAL_STEPS) {
    renderQuestion();
  } else {
    setTimeout(showFinalResult, 600);
  }
}

function showFinalResult() {
  const res = GAME_DATA.results[lastChoiceType] || GAME_DATA.results.B;

  // クイズ画面を非表示にし、結果画面を表示
  document.getElementById('quiz').style.display = 'none';
  const resultScreen = document.getElementById('result');
  resultScreen.classList.add('active');

  // テキストの反映
  document.getElementById('res-stars').textContent = res.stars;
  document.getElementById('res-tag').textContent = res.tag;
  document.getElementById('res-title').textContent = res.title;
  document.getElementById('res-rank').textContent = res.rank;
  document.getElementById('res-copy').innerHTML = res.copy;

  // 画像・絵文字の反映
  const charImg = document.getElementById('res-char-img');
  const fallback = document.getElementById('res-char-fallback');
  if (res.img) {
    charImg.src = res.img;
    charImg.style.display = 'block';
    fallback.style.display = 'none';
  } else {
    charImg.style.display = 'none';
    fallback.style.display = 'block';
    fallback.textContent = res.fallbackEmoji;
  }
}

function restartGame() {
  location.reload();
}

window.onload = () => {
  updatePlayerPosition();
  renderQuestion();
};
</script>
