<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>タップゲーム</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      text-align: center;
      background: #f0f4f8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      user-select: none;
      -webkit-user-select: none;
    }
    #tap-btn {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: none;
      background: #06c755; /* LINEグリーン */
      color: white;
      font-size: 24px;
      font-weight: bold;
      box-shadow: 0 8px 15px rgba(0,0,0,0.2);
      cursor: pointer;
      outline: none;
    }
    #tap-btn:active {
      transform: scale(0.95);
    }
    .score-board {
      font-size: 28px;
      margin-bottom: 24px;
      color: #333;
    }
    #share-btn {
      margin-top: 20px;
      padding: 10px 20px;
      border: 1px solid #06c755;
      background: white;
      color: #06c755;
      border-radius: 20px;
      display: none;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <div class="score-board">スコア: <span id="score">0</span></div>
  <button id="tap-btn">タップ！</button>
  <button id="share-btn" onclick="shareScore()">友だちに結果を送る</button>

  <script>
    const LIFF_ID = "YOUR_LIFF_ID"; // 発行されたLIFF IDに置き換え
    let score = 0;

    // LIFF初期化
    liff.init({ liffId: LIFF_ID }).catch(err => console.error(err));

    // タップイベント
    document.getElementById('tap-btn').addEventListener('click', () => {
      score++;
      document.getElementById('score').textContent = score;

      if (score >= 10) {
        document.getElementById('share-btn').style.display = 'inline-block';
      }
    });

    // LINEメッセージ送信（スコア共有）
    async function shareScore() {
      if (liff.isApiAvailable('shareTargetPicker')) {
        await liff.shareTargetPicker([
          {
            type: 'text',
            text: `タップゲームでスコア ${score}点 を獲得しました！`
          }
        ]);
      } else {
        alert('共有機能はお使いの環境でサポートされていません。');
      }
    }
  </script>
</body>
</html>
